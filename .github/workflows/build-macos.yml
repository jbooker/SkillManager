name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Package Skill Manager
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test --package-path macos

      - name: Package app
        env:
          APP_BUILD: ${{ github.run_number }}
        run: bash scripts/package-macos.sh --skip-tests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skill-Manager-${{ steps.version.outputs.version }}
          path: release/Skill-Manager-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          dmg="release/Skill-Manager-${VERSION}.dmg"
          {
            echo "Skill Manager **${VERSION}** (build ${GITHUB_RUN_NUMBER}) from [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "## Install"
            echo
            echo "1. Download **Skill-Manager-${VERSION}.dmg**."
            echo "2. Open the disk image and drag **Skill Manager** into **Applications**."
            echo "3. The first time you launch it, right-click the app and choose **Open**. Apple Gatekeeper warns because this build is not notarized."
            echo
            echo "Runs on Intel and Apple silicon, macOS 14 or later."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release delete macos-latest --yes --cleanup-tag || true
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$dmg" --clobber
            gh release edit "$tag" \
              --title "Skill Manager ${VERSION}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          else
            gh release create "$tag" "$dmg" \
              --title "Skill Manager ${VERSION}" \
              --target "$GITHUB_SHA" \
              --latest \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
